name: Deploy ClaycrazE Site to SiteGround (PROD)

on:
  push:
    branches: [ "cc_admin_render" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.SG_CI_KEY }}" > ~/.ssh/sg_ci
          sed -i 's/\r$//' ~/.ssh/sg_ci
          chmod 600 ~/.ssh/sg_ci

      - name: Deploy public site and gallery artifacts
        shell: bash
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_USER: ${{ secrets.SG_USER }}
        run: |
          set -euo pipefail

          echo "Preparing SiteGround public folders..."

          ssh -p "$SG_PORT" -i ~/.ssh/sg_ci -o StrictHostKeyChecking=no "$SG_USER@$SG_HOST" \
            "mkdir -p \
              \$HOME/public_html/css \
              \$HOME/public_html/js \
              \$HOME/public_html/gallery \
              \$HOME/public_html/data \
              \$HOME/public_html/images/curated \
              \$HOME/public_html/images/full \
              \$HOME/public_html/images/thumbs"

          echo "Syncing public HTML pages..."

          rsync -avz \
            -e "ssh -p $SG_PORT -i ~/.ssh/sg_ci -o StrictHostKeyChecking=no" \
            public/*.html \
            "$SG_USER@$SG_HOST:\$HOME/public_html/"

          echo "Syncing CSS..."

          rsync -avz \
            -e "ssh -p $SG_PORT -i ~/.ssh/sg_ci -o StrictHostKeyChecking=no" \
            public/css/ \
            "$SG_USER@$SG_HOST:\$HOME/public_html/css/"

          echo "Syncing JavaScript..."

          rsync -avz \
            -e "ssh -p $SG_PORT -i ~/.ssh/sg_ci -o StrictHostKeyChecking=no" \
            public/js/ \
            "$SG_USER@$SG_HOST:\$HOME/public_html/js/"

          echo "Syncing gallery pages..."

          rsync -avz \
            -e "ssh -p $SG_PORT -i ~/.ssh/sg_ci -o StrictHostKeyChecking=no" \
            public/gallery/ \
            "$SG_USER@$SG_HOST:\$HOME/public_html/gallery/"

          echo "Syncing curated images..."

          rsync -avz \
            -e "ssh -p $SG_PORT -i ~/.ssh/sg_ci -o StrictHostKeyChecking=no" \
            public/images/curated/ \
            "$SG_USER@$SG_HOST:\$HOME/public_html/images/curated/"

          echo "Syncing full-size approved images..."

          rsync -avz --delete \
            -e "ssh -p $SG_PORT -i ~/.ssh/sg_ci -o StrictHostKeyChecking=no" \
            public/images/full/ \
            "$SG_USER@$SG_HOST:\$HOME/public_html/images/full/"

          echo "Syncing approved thumbnails..."

          rsync -avz --delete \
            -e "ssh -p $SG_PORT -i ~/.ssh/sg_ci -o StrictHostKeyChecking=no" \
            public/images/thumbs/ \
            "$SG_USER@$SG_HOST:\$HOME/public_html/images/thumbs/"

          echo "Syncing approved gallery metadata..."

          rsync -avz \
            -e "ssh -p $SG_PORT -i ~/.ssh/sg_ci -o StrictHostKeyChecking=no" \
            public/data/pieces.json \
            "$SG_USER@$SG_HOST:\$HOME/public_html/data/pieces.json"

          echo "Deploy complete. Public site updated; SG public_html was not wiped."