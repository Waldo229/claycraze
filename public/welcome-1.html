<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Study 1 | ClaycrazE</title>
  <link rel="stylesheet" href="/css/welcome-studies.css?v=1">
</head>
<body class="welcome-study-page">
  <a class="study-skip-link" href="#welcome-study">Skip to the entrance</a>

  <main class="welcome-study" id="welcome-study" tabindex="-1">
    <a class="monk-path theory-path" href="/theory.html">
      <span class="monk-figure">
        <img
          src="/images/han-shan.png"
          alt="Hanshan, the companion monk"
          width="200"
          height="563"
        >
      </span>
      <span class="path-copy">
        <span class="path-name">Theory</span>
        <span class="path-room">The Studio</span>
      </span>
    </a>

    <section class="welcome-center" aria-labelledby="welcome-title">
      <p class="welcome-overline">The Pottery of Jim Alexander</p>
      <h1 id="welcome-title">Welcome to ClaycrazE</h1>
      <p class="welcome-pair">Theory <span aria-hidden="true">&amp;</span> Practice</p>
      <div class="center-rule" aria-hidden="true"></div>
      <p class="welcome-invitation">Choose a way into the work.</p>
    </section>

    <a class="monk-path practice-path" href="/practice.html">
      <span class="monk-figure">
        <img
          src="/images/shih-te.png"
          alt="Shide, the monk holding a broom"
          width="200"
          height="566"
        >
      </span>
      <span class="path-copy">
        <span class="path-name">Practice</span>
        <span class="path-room">The Gallery</span>
      </span>
    </a>

    <footer class="study-footer">
      <p class="study-credo">Great ideas are messy.</p>
      <p class="study-attribution">
        Hanshan and Shide, traditionally attributed to Yan Hui,
        late 13th&ndash;early 14th century. Public domain.
      </p>
    </footer>
  </main>
</body>
</html>
