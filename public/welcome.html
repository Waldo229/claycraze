<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Welcome | ClaycrazE</title>

  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png" />

  <link rel="stylesheet" href="/css/styles.css?v=14" />
</head>

<body>

  <main class="welcome-threshold">

    <section class="welcome-hero">

      <h1>Welcome</h1>

      <p>
        Let me introduce you to two old friends: Theory and Practice.
        One thinks; one works. The studio needs them both.
      </p>

    </section>

    <section class="welcome-doors" aria-label="Theory and Practice">

      <!-- THEORY -->

      <a class="welcome-card theory-door" href="/theory.html">

        <img
          src="/images/han-shan.png"
          alt="Han Shan"
        />

        <div class="welcome-card-text">
          <h2>Theory</h2>

          <p>
            Reflection, materials, places, memory,
            and the thinking that gives the work depth.
          </p>
        </div>

      </a>

      <!-- PRACTICE -->

      <a class="welcome-card practice-door" href="/practice.html">

        <img
          src="/images/shih-te.png"
          alt="Shih-te"
        />

        <div class="welcome-card-text">
          <h2>Practice</h2>

          <p>
            Pots, trees, vessels, tools, firing,
            and the daily life of making.
          </p>
        </div>

      </a>

    </section>

  </main>

</body>
</html>
