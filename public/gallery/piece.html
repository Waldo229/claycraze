<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Piece | ClaycrazE</title>

  <link rel="stylesheet" href="/css/styles.css?v=1012" />
  <link rel="stylesheet" href="/css/gallery.css?v=1012" />
</head>

<body class="practice-page">

  <header class="site-header">
    <div class="header-shell">
      <a class="site-brand" href="/index.html">
        <span class="site-title">ClaycrazE</span>
        <span class="site-tag">Theory &amp; Practice</span>
      </a>

      <nav class="site-nav" aria-label="Main navigation">
        <a href="/index.html">Home</a>
        <a href="/theory.html">Theory</a>
        <a href="/practice.html">Practice</a>
        <a href="/gallery/bonsai.html">Bonsai</a>
      </nav>
    </div>
  </header>

  <main class="piece-page compact-piece-page">

    <nav class="piece-local-nav" aria-label="Piece navigation">
      <a href="/gallery/ovals.html">← Back to Ovals</a>
    </nav>

    <section id="pieceContent">
      <div class="loading">Loading piece...</div>
    </section>

  </main>

  <script>
    document.addEventListener("DOMContentLoaded", loadPiece);

    async function loadPiece() {
      const container = document.getElementById("pieceContent");
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");

      if (!id) {
        container.innerHTML = `<div class="empty-state">No piece selected.</div>`;
        return;
      }

      try {
        const response = await fetch("/data/pieces.json?v=1012");

        if (!response.ok) {
          throw new Error(`Server returned ${response.status}`);
        }

        const pieces = await response.json();

        const piece = pieces.find(item =>
          String(item.id || item.piece_number || "").trim() === id
        );

        if (!piece) {
          container.innerHTML = `<div class="empty-state">Piece not found.</div>`;
          return;
        }

        renderPiece(piece, container);

      } catch (error) {
        console.error("Piece page error:", error);
        container.innerHTML = `<div class="empty-state">Could not load this piece.</div>`;
      }
    }

    function renderPiece(piece, container) {
      const id = piece.id || piece.piece_number || "";
      const title = piece.title || "ClaycrazE Vessel";
      const dimensions = piece.dimensions || "";
      const clay = piece.clay || "";
      const finish = piece.finish || piece.glaze || "";
      const price = piece.price || "";
      const description = piece.description || "";

      const topImage = normalizeImagePath(piece.top_image || piece.thumbnail || "");
      const bottomImage = normalizeImagePath(piece.bottom_image || "");

      document.title = `${title} | ClaycrazE`;

      const shortDescription = makeShortDescription(description);

      container.innerHTML = `
        <section class="piece-dashboard">

          <div class="piece-image-column">

            <article class="piece-mini-tile">
              <a href="/gallery/viewer.html?id=${encodeURIComponent(id)}&view=top">
                <img src="${escapeAttribute(topImage)}" alt="${escapeAttribute(title)} top view" />
              </a>
              <div class="piece-mini-caption">Top</div>
            </article>

            <article class="piece-mini-tile">
              <a href="/gallery/viewer.html?id=${encodeURIComponent(id)}&view=bottom">
                <img src="${escapeAttribute(bottomImage)}" alt="${escapeAttribute(title)} bottom view" />
              </a>
              <div class="piece-mini-caption">Bottom</div>
            </article>

          </div>

          <aside class="piece-label-card">
            <p class="eyebrow">ClaycrazE / ${escapeHtml(id)}</p>

            <h1>${escapeHtml(title)}</h1>

            <div class="piece-facts compact-facts">
              ${dimensions ? `<p><strong>Dimensions:</strong> ${escapeHtml(dimensions)}</p>` : ""}
              ${(clay || finish) ? `<p><strong>Clay / Finish:</strong> ${escapeHtml(clay)}${clay && finish ? " / " : ""}${escapeHtml(finish)}</p>` : ""}
              ${price ? `<p><strong>Status:</strong> ${escapeHtml(price)}</p>` : ""}
            </div>

            <div class="piece-description compact-description">
              ${escapeHtml(shortDescription).replace(/\n/g, "<br>")}
            </div>

            <p class="lao-line">
              The foot tells the truth. Lao-Tzu would probably check there first.
            </p>
          </aside>

        </section>
      `;
    }

    function makeShortDescription(text) {
      if (!text) return "A quiet vessel for attentive viewing.";

      const parts = String(text)
        .split(/\n\s*\n/)
        .map(part => part.trim())
        .filter(Boolean);

      return parts.slice(0, 3).join("\n\n");
    }

    function normalizeImagePath(path) {
      if (!path) return "";
      const clean = String(path).trim().replace(/\\/g, "/");
      if (clean.startsWith("/") || clean.startsWith("http://") || clean.startsWith("https://")) return clean;
      return `/${clean.replace(/^\.?\/*/, "")}`;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value);
    }
  </script>

</body>
</html>
