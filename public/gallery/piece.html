<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" >
  <meta name="viewport" content="width=device-width, initial-scale=1.0" >

  <title>ClaycrazE | Piece View</title>

  <link rel="stylesheet" href="/css/styles.css?v=3035" >
  <link rel="stylesheet" href="/css/gallery.css?v=2001" >

  <style>
    body.piece-body {
      margin: 0;

      background:
        radial-gradient(circle at top left,
        rgba(236,214,149,0.07),
        transparent 34rem),
        #120b06;

      color: #eadfc8;
      font-family: "Palatino Linotype", Palatino, "Book Antiqua", serif;
    }

    .piece-shell {
      width: min(1200px, 92vw);
      margin: 0 auto;
      padding: 3rem 0 5rem;
    }

    .piece-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .piece-topbar a {
      color: rgba(244,231,198,0.82);
      text-decoration: none;
      font-size: 0.95rem;
    }

    .piece-topbar a:hover {
      color: #fff3d6;
    }

    .piece-grid {
      display: grid;
      grid-template-columns: 1.35fr 0.8fr;
      gap: 3rem;
      align-items: start;
    }

    .piece-hero {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .piece-main-image {
      display: block;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;

      background: rgba(255,255,255,0.02);

      border: 1px solid rgba(255,255,255,0.04);

      box-shadow:
        0 30px 90px rgba(0,0,0,0.45),
        0 0 0 1px rgba(242,230,201,0.03);
    }

    .piece-main-image img {
      width: 100%;
      display: block;
      cursor: zoom-in;
    }

    .piece-thumbs {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .piece-thumb {
      appearance: none;
      padding: 0;
      margin: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      width: 92px;
      height: 92px;

      border-radius: 10px;
      overflow: hidden;

      cursor: pointer;

      border: 1px solid rgba(255,255,255,0.08);

      opacity: 0.7;

      transition:
        opacity 160ms ease,
        transform 160ms ease,
        border-color 160ms ease;
    }

    .piece-thumb.active {
      opacity: 1;
      border-color: rgba(244,231,198,0.45);
      transform: translateY(-2px);
    }

    .piece-thumb:hover {
      opacity: 1;
    }

    .piece-thumb:focus-visible,
    .piece-main-image:focus-visible {
      outline: 2px solid #f5e8c7;
      outline-offset: 4px;
    }

    .piece-thumb:focus-visible {
      opacity: 1;
    }

    .piece-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .piece-info {
      padding-top: 1rem;
    }

    .piece-kicker {
      font-size: 0.82rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(244,231,198,0.55);
      margin-bottom: 1rem;
    }

    .piece-title {
      font-size: clamp(2rem, 4vw, 3.3rem);
      line-height: 1.05;
      margin: 0 0 1rem;
      color: #f5e8c7;
    }

    .piece-description {
      color: rgba(244,231,198,0.8);
      line-height: 1.75;
      font-size: 1rem;
      margin-bottom: 2rem;
    }

    .piece-meta {
      display: grid;
      gap: 1rem;
      margin-top: 2rem;
    }

    .piece-meta-row {
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .piece-meta-label {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(244,231,198,0.50);
      margin-bottom: 0.4rem;
    }

    .piece-meta-value {
      color: rgba(244,231,198,0.88);
      line-height: 1.5;
    }

    .piece-price {
      margin-top: 2rem;
      font-size: 1.3rem;
      color: #f5e8c7;
    }

    @media (max-width: 760px) {
      body.piece-body {
        padding-inline: 0;
      }
    }

    @media (max-width: 900px) {

      .piece-grid {
        grid-template-columns: 1fr;
      }

      .piece-info {
        padding-top: 0;
      }
    }
  </style>
</head>

<body class="piece-body">

  <main class="piece-shell">

    <div class="piece-topbar">
      <a id="backToGallery" href="/practice.html">← Back to Practice</a>
      <a href="/practice.html">Practice</a>
    </div>

    <section id="pieceContainer"></section>

  </main>

  <script>

    document.addEventListener("DOMContentLoaded", loadPiece);

    async function loadPiece() {

      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");

      const container = document.getElementById("pieceContainer");

      if (!id) {
        container.innerHTML = `<p>Piece not found.</p>`;
        return;
      }

      try {
        const { getGalleryContext, formatDimensions } = await import("/js/gallery-context.js?v=1020");

        const response = await fetch(`/data/pieces.json?v=${Date.now()}`);
        const pieces = await response.json();

        const piece = pieces.find(item =>
          String(item.id || "").trim() === id
        );

        if (!piece) {
          container.innerHTML = `<p>Piece not found.</p>`;
          return;
        }

        const context = getGalleryContext(piece);
        const backToGallery = document.getElementById("backToGallery");
        backToGallery.href = context.returnUrl;
        backToGallery.textContent = `← ${context.returnLabel}`;

        const images = [];

        if (piece.image_path_2) {
          images.push({
            type: "top",
            src: normalizeImagePath(piece.image_path_2)
          });
        }

        if (piece.image_path_3) {
          images.push({
            type: "bottom",
            src: normalizeImagePath(piece.image_path_3)
          });
        }

        if (piece.image_path_4) {
          images.push({
            type: "detail",
            src: normalizeImagePath(piece.image_path_4)
          });
        }

        const selectedImage = images.find(image => image.type === params.get("view")) || images[0];
        const heroImage = selectedImage?.src || "";
        const heroType = selectedImage?.type || "top";

        container.innerHTML = `
          <div class="piece-grid">

            <div class="piece-hero">

              <a id="mainPieceLink" class="piece-main-image">
                <img
                  id="mainPieceImage"
                  src="${heroImage}"
                  alt="${piece.title || "ClaycrazE Vessel"}"
                >
              </a>

              <div class="piece-thumbs">

                ${images.map(img => `

                  <button
                    type="button"
                    aria-pressed="${img.type === heroType}"
                    class="piece-thumb ${img.type === heroType ? "active" : ""}"
                    data-view="${img.type}"
                    data-src="${img.src}"
                  >
                    <img src="${img.src}" alt="" >
                  </button>

                `).join("")}

              </div>

            </div>

            <aside class="piece-info">

              <div class="piece-kicker">
                ClaycrazE / ${context.categoryLabel}
              </div>

              <h1 class="piece-title">
                ${piece.title || piece.id}
              </h1>

              <div class="piece-description">
                ${piece.description || "No description available."}
              </div>

              <div class="piece-meta">

                <div class="piece-meta-row">
                  <div class="piece-meta-label">Dimensions</div>
                  <div class="piece-meta-value">
                    ${formatDimensions(piece, piece.shape) || "—"}
                  </div>
                </div>

                <div class="piece-meta-row">
                  <div class="piece-meta-label">Clay Body</div>
                  <div class="piece-meta-value">
                    ${piece.clay_body || "—"}
                  </div>
                </div>

                <div class="piece-meta-row">
                  <div class="piece-meta-label">Glaze</div>
                  <div class="piece-meta-value">
                    ${piece.glaze || "—"}
                  </div>
                </div>

                <div class="piece-meta-row">
                  <div class="piece-meta-label">Status</div>
                  <div class="piece-meta-value">
                    ${piece.status || "available"}
                  </div>
                </div>

              </div>

              ${piece.price ? `

                <div class="piece-price">
                  $${piece.price}
                </div>

              ` : ""}

            </aside>

          </div>
        `;

        setupGallery(piece.id, heroType);

      } catch (error) {

        console.error(error);

        container.innerHTML = `
          <p>Could not load piece.</p>
        `;
      }
    }

    function setupGallery(id, initialView) {
      const mainImage = document.getElementById("mainPieceImage");
      const mainLink = document.getElementById("mainPieceLink");
      const thumbs = document.querySelectorAll(".piece-thumb");

      function selectView(view, src) {
        if (src) mainImage.src = src;
        const query = new URLSearchParams(window.location.search);
        query.set("id", id);
        query.set("view", view);
        mainLink.href = `/gallery/viewer.html?${query}`;
        mainLink.setAttribute("aria-label", `Open full-size ${view} view of ${id}`);

        thumbs.forEach(thumb => {
          const selected = thumb.dataset.view === view;
          thumb.classList.toggle("active", selected);
          thumb.setAttribute("aria-pressed", String(selected));
        });
      }

      thumbs.forEach(thumb => {
        thumb.setAttribute("aria-label", `Show ${thumb.dataset.view} view of ${id}`);
        thumb.addEventListener("click", () => selectView(thumb.dataset.view, thumb.dataset.src));
      });

      selectView(initialView);
    }

    function normalizeImagePath(path) {

      if (!path) return "";

      const clean = String(path)
        .trim()
        .replace(/\\/g, "/");

      if (
        clean.startsWith("/") ||
        clean.startsWith("http://") ||
        clean.startsWith("https://")
      ) {
        return clean;
      }

      return `/${clean.replace(/^\.?\/*/, "")}`;
    }

  </script>

</body>
</html>
