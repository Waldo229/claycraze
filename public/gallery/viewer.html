<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" >
  <meta name="viewport" content="width=device-width, initial-scale=1.0" >

  <title>Image Viewer | ClaycrazE</title>

  <link rel="stylesheet" href="/css/styles.css?v=3035" >
  <link rel="stylesheet" href="/css/gallery.css?v=1012" >

  <style>
    body.viewer-body {
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(236, 214, 149, 0.08), transparent 34rem),
        #120b06;
      color: #eadfc8;
      font-family: "Palatino Linotype", Palatino, "Book Antiqua", serif;
    }

    .viewer-topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.4rem;
      background: rgba(12, 8, 5, 0.78);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(242, 230, 201, 0.08);
    }

    .viewer-nav {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .viewer-topbar a {
      color: rgba(244, 231, 198, 0.78);
      text-decoration: none;
      font-size: 0.95rem;
    }

    .viewer-topbar a:hover {
      color: #fff3d6;
    }

    .viewer-title {
      font-size: 1rem;
      letter-spacing: 0.04em;
      color: rgba(244, 231, 198, 0.84);
      text-align: right;
    }

    .viewer-stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: grab;
    }

    .viewer-stage.dragging {
      cursor: grabbing;
    }

    #viewerImage {
      max-width: 88vw;
      max-height: 82vh;
      border-radius: 8px;
      transform-origin: center center;
      user-select: none;
      -webkit-user-drag: none;
      touch-action: pinch-zoom;
      box-shadow:
        0 30px 90px rgba(0, 0, 0, 0.52),
        0 0 0 1px rgba(242, 230, 201, 0.04);
    }

    .viewer-help {
      position: fixed;
      left: 50%;
      bottom: 1.2rem;
      transform: translateX(-50%);
      z-index: 20;
      padding: 0.55rem 0.9rem;
      border-radius: 999px;
      background: rgba(18, 11, 6, 0.72);
      border: 1px solid rgba(242, 230, 201, 0.06);
      color: rgba(244, 231, 198, 0.62);
      font-size: 0.82rem;
      letter-spacing: 0.02em;
      backdrop-filter: blur(6px);
    }

    .viewer-controls {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 4.2rem;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.4rem;
      width: max-content;
      max-width: calc(100vw - 2rem);
      padding: 0.4rem;
      background: rgba(18, 11, 6, 0.9);
      border: 1px solid rgba(242, 230, 201, 0.2);
      border-radius: 6px;
      font-size: 0.82rem;
    }

    .viewer-controls button {
      appearance: none;
      margin: 0;
      padding: 0.4rem 0.55rem;
      min-height: 32px;
      border: 1px solid rgba(242, 230, 201, 0.35);
      border-radius: 3px;
      background: transparent;
      color: #eadfc8;
      font: inherit;
      cursor: pointer;
    }

    .viewer-controls button:hover {
      border-color: #f5e8c7;
    }

    .viewer-controls button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .viewer-controls button:focus-visible,
    .viewer-stage:focus-visible {
      outline: 2px solid #f5e8c7;
      outline-offset: 3px;
    }

    .viewer-stage:focus-visible {
      outline-offset: -4px;
    }

    .viewer-zoom-status {
      min-width: 5.5em;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .viewer-keyboard-help {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (max-width: 700px) {
      .viewer-topbar {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
      }

      .viewer-title {
        text-align: left;
      }

      #viewerImage {
        max-width: 94vw;
        max-height: 78vh;
      }

      .viewer-help {
        font-size: 0.72rem;
        bottom: 0.8rem;
      }
    }
  </style>
</head>

<body class="viewer-body">

  <nav class="viewer-topbar" aria-label="Viewer navigation">
    <div class="viewer-nav">
      <a id="backToPiece" href="/gallery/piece.html">← Back to Piece</a>
      <a class="active" href="/practice.html" aria-current="location">Practice</a>
      <a id="backToGallery" href="/practice.html">← Back to Practice</a>
    </div>

    <div id="viewerTitle" class="viewer-title">
      ClaycrazE Viewer
    </div>
  </nav>

  <div class="viewer-controls" role="group" aria-label="Image zoom controls">
    <button id="zoomIn" type="button" aria-controls="viewerImage" disabled>Zoom in</button>
    <button id="zoomOut" type="button" aria-controls="viewerImage" disabled>Zoom out</button>
    <button id="resetView" type="button" aria-controls="viewerImage" disabled>Reset view</button>
    <span id="zoomStatus" class="viewer-zoom-status" role="status" aria-live="polite" aria-atomic="true">100% zoom</span>
  </div>

  <main id="viewerStage" class="viewer-stage" tabindex="0" aria-label="Full-size image viewer" aria-describedby="viewerKeyboardHelp">
    <span id="viewerKeyboardHelp" class="viewer-keyboard-help">Press plus or equals to zoom in, minus to zoom out, and zero to reset. Use arrow keys to pan when zoomed.</span>
    <img id="viewerImage" src="" alt="" >
  </main>

  <div class="viewer-help">
    Scroll to zoom · drag to pan · double-click to reset
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", loadViewer);

    async function loadViewer() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      const view = params.get("view") || "top";

      const image = document.getElementById("viewerImage");
      const title = document.getElementById("viewerTitle");
      const backToPiece = document.getElementById("backToPiece");

      if (!id) {
        title.textContent = "No piece selected";
        return;
      }

      backToPiece.href = `/gallery/piece.html?${params}`;

      try {
        const { getGalleryContext } = await import("/js/gallery-context.js?v=1020");
        const response = await fetch(`/data/pieces.json?v=${Date.now()}`);
        if (!response.ok) throw new Error("Could not fetch pieces.json");

        const pieces = await response.json();

        const piece = pieces.find(item =>
          String(item.id || "").trim() === id ||
          String(item.piece_number || "").trim() === id
        );

        if (!piece) {
          title.textContent = "Piece not found";
          return;
        }

        params.set("id", piece.id);
        params.set("view", view);
        backToPiece.href = `/gallery/piece.html?${params}`;
        const context = getGalleryContext(piece);
        const backToGallery = document.getElementById("backToGallery");
        backToGallery.href = context.returnUrl;
        backToGallery.textContent = `← ${context.returnLabel}`;

        const pieceTitle = piece.title || piece.id || "ClaycrazE Vessel";

        let imagePath = "";

        if (view === "bottom") {
          imagePath = normalizeImagePath(piece.image_path_3 || "");
        } else if (view === "detail") {
          imagePath = normalizeImagePath(piece.image_path_4 || "");
        } else {
          imagePath = normalizeImagePath(piece.image_path_2 || piece.image_path || "");
        }

        if (!imagePath) {
          title.textContent = `No ${view} image found`;
          return;
        }

        image.src = imagePath;
        image.alt = `${pieceTitle} ${view} view`;
        title.textContent = `${pieceTitle} / ${view}`;

        setupPanZoom();

      } catch (error) {
        console.error("Viewer error:", error);
        title.textContent = "Could not load image";
      }
    }

    function setupPanZoom() {
      const stage = document.getElementById("viewerStage");
      const image = document.getElementById("viewerImage");
      const zoomStatus = document.getElementById("zoomStatus");
      let scale = 1;
      let x = 0;
      let y = 0;
      let activePointer = null;
      let startX = 0;
      let startY = 0;
      let announcementTimer;

      function applyTransform() {
        image.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
      }

      function announceZoom() {
        clearTimeout(announcementTimer);
        announcementTimer = setTimeout(() => {
          zoomStatus.textContent = `${Math.round(scale * 100)}% zoom`;
        }, 150);
      }

      function zoom(direction) {
        scale = Math.min(Math.max(scale + direction * 0.15, 1), 8);
        applyTransform();
        announceZoom();
      }

      function reset() {
        scale = 1;
        x = 0;
        y = 0;
        applyTransform();
        announceZoom();
      }

      for (const [id, action] of [
        ["zoomIn", () => zoom(1)],
        ["zoomOut", () => zoom(-1)],
        ["resetView", reset]
      ]) {
        const button = document.getElementById(id);
        button.disabled = false;
        button.addEventListener("click", action);
      }

      stage.addEventListener("keydown", event => {
        if (event.target !== stage || event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.key === "+" || event.key === "=") {
          event.preventDefault();
          zoom(1);
        } else if (event.key === "-") {
          event.preventDefault();
          zoom(-1);
        } else if (event.key === "0") {
          event.preventDefault();
          reset();
        } else if (scale > 1 && ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(event.key)) {
          event.preventDefault();
          if (event.key === "ArrowLeft") x -= 40;
          if (event.key === "ArrowRight") x += 40;
          if (event.key === "ArrowUp") y -= 40;
          if (event.key === "ArrowDown") y += 40;
          applyTransform();
        }
      });

      stage.addEventListener("wheel", event => {
        event.preventDefault();
        zoom(event.deltaY < 0 ? 1 : -1);
      }, { passive: false });

      image.addEventListener("pointerdown", event => {
        if (!event.isPrimary || event.button !== 0) return;
        activePointer = event.pointerId;
        stage.classList.add("dragging");
        stage.focus({ preventScroll: true });
        startX = event.clientX - x;
        startY = event.clientY - y;
        image.setPointerCapture(event.pointerId);
      });

      image.addEventListener("pointermove", event => {
        if (event.pointerId !== activePointer) return;
        x = event.clientX - startX;
        y = event.clientY - startY;
        applyTransform();
      });

      function stopDragging(event) {
        if (event.pointerId !== activePointer) return;
        activePointer = null;
        stage.classList.remove("dragging");
        if (image.hasPointerCapture(event.pointerId)) image.releasePointerCapture(event.pointerId);
      }

      image.addEventListener("pointerup", stopDragging);
      image.addEventListener("pointercancel", stopDragging);
      image.addEventListener("lostpointercapture", stopDragging);
      image.addEventListener("dragstart", event => event.preventDefault());
      stage.addEventListener("dblclick", reset);
      applyTransform();
    }

    function normalizeImagePath(path) {
      if (!path) return "";

      const clean = String(path).trim().replace(/\\/g, "/");

      if (
        clean.startsWith("/") ||
        clean.startsWith("http://") ||
        clean.startsWith("https://")
      ) {
        return clean;
      }

      return `/${clean.replace(/^\.?\/*/, "")}`;
    }
  </script>

</body>
</html>
