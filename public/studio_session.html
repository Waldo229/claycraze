<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Studio Session | ClaycrazE</title>

  <style>
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: #2d241f;
      color: #f2ede7;
    }

    .studio-session-page {
      max-width: 980px;
      margin: 0 auto;
      padding: 48px 24px 72px;
    }

    .studio-session-page h1 {
      margin: 0 0 24px;
      font-size: 2.5rem;
      font-weight: normal;
      text-align: center;
    }

    .studio-hatteras-banner {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto 28px;
      border-radius: 14px;
    }

    .studio-hatteras-note {
      max-width: 760px;
      margin: 0 auto;
      font-size: 1.1rem;
      line-height: 1.7;
    }

    .studio-hatteras-note p {
      margin: 0 0 22px;
    }

    .studio-hatteras-note a {
      color: #f2ede7;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .studio-hatteras-note a:hover {
      opacity: 0.8;
    }

    .gene-glow {
      display: inline-block;
      margin-right: 8px;
      color: #ffd36a;
      text-shadow:
        0 0 5px #ffd36a,
        0 0 10px #ffd36a,
        0 0 16px #ffb347;
    }

    .obx-signoff {
      letter-spacing: 0.08em;
    }

    @media (max-width: 700px) {
      .studio-session-page {
        padding: 28px 16px 48px;
      }

      .studio-session-page h1 {
        font-size: 2rem;
      }

      .studio-hatteras-note {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>

  <main class="studio-session-page">

    <h1>Studio Session</h1>

    <img
      src="/images/jeep_obxox.png"
      alt="White Jeep and surf-fishing rods on the beach at Hatteras"
      class="studio-hatteras-banner"
    >

    <div class="studio-hatteras-note">

      <p>
        <span class="gene-glow">&#9679;</span>
        <strong>GENE says:</strong>
        Start no studio session without
        <a
          href="https://www.radiohatteras.org/listen-live"
          target="_blank"
          rel="noopener noreferrer"
        >Radio Hatteras</a>
        and a cup of Joe from Alien Java.
      </p>

      <p>
        And if you&rsquo;re in Buxton, stop by
        <a
          href="https://www.surfintheeye.com/"
          target="_blank"
          rel="noopener noreferrer"
        >Natural Art Surf Shop</a>
        and buy the Radio Free Hatteras T-shirt.
        You&rsquo;ll be glad you did.
      </p>

      <p>
        If you see my Jeep on the beach, say hello.
      </p>

      <p class="obx-signoff">
        <strong>OBXOX &middot; NCBBA-16615</strong>
      </p>

    </div>

  </main>

</body>
</html>
